name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  backend-tests:
    name: Functions Build and Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Secret Hygiene Guard
        run: |
          set -euo pipefail
          cd ..
          if grep -R -n -E "functions\.config\(" functions/src functions/index.js functions/email_duplicate_cleanup.js; then
            echo "Found forbidden functions.config() usage"
            exit 1
          fi
          if grep -R -n -E "rzp_test_[A-Za-z0-9]{8,}|rzp_live_[A-Za-z0-9]{8,}" README.md docs functions/src functions/index.js; then
            echo "Found key-like literals in repository content"
            exit 1
          fi

      - name: Lint and typecheck
        run: |
          npm run lint
          npm run typecheck

      - name: Build
        run: npm run build

      - name: Test with coverage
        run: npm run test:ci
