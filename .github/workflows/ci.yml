name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  backend-tests:
    name: Functions Build and Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Secret Hygiene Guard
        run: |
          set -euo pipefail
          cd ..
          if grep -R -n -E "functions\.config\(" functions/src functions/index.js functions/email_duplicate_cleanup.js; then
            echo "Found forbidden functions.config() usage"
            exit 1
          fi
          if grep -R -n -E "rzp_test_[A-Za-z0-9]{8,}|rzp_live_[A-Za-z0-9]{8,}" README.md docs functions/src functions/index.js; then
            echo "Found key-like literals in repository content"
            exit 1
          fi

      - name: Lint and typecheck
        run: |
          npm run lint
          npm run typecheck

      - name: Build
        run: npm run build

      - name: Test with coverage
        run: npm run test:ci

  flutter-auth-smoke:
    name: Flutter Auth Emulator Smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter pub get
        run: flutter pub get

      - name: Setup Node.js for Firebase CLI
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Run auth smoke test against emulators
        run: |
          firebase emulators:exec --only auth,firestore "flutter test integration_test/auth_emulator_smoke_test.dart --dart-define=USE_AUTH_EMULATOR=true --dart-define=USE_FIRESTORE_EMULATOR=true --dart-define=FIREBASE_EMULATOR_HOST=127.0.0.1 --dart-define=AUTH_EMULATOR_PORT=9099 --dart-define=FIRESTORE_EMULATOR_PORT=8080"

  flutter-analyze-and-test:
    name: Flutter Analyze & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (strict)
        run: flutter analyze --fatal-warnings

      - name: Run unit tests
        run: flutter test --reporter expanded
