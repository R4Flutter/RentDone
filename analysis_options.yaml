# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# Production-grade analysis options for RentDone.
# Enforces strict rules to prevent regressions.

include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # Treat these as errors to prevent accidental regressions
    avoid_print: error
    cancel_subscriptions: warning
    close_sinks: warning
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"

linter:
  rules:
    # --- Safety ---
    avoid_print: true                     # Catches accidental print() — use AppLogger
    cancel_subscriptions: true            # Prevent memory leaks from uncancelled streams
    close_sinks: true                     # Prevent resource leaks
    always_declare_return_types: true      # Explicit return types for clarity
    avoid_empty_else: true                # Prevent empty else blocks
    avoid_returning_null_for_future: true  # Prevent null Future returns

    # --- Consistency ---
    prefer_const_constructors: true
    prefer_const_declarations: true
    prefer_final_locals: true
    prefer_final_in_for_each: true
    use_key_in_widget_constructors: true
    sized_box_for_whitespace: true
    use_full_hex_values_for_flutter_colors: true

    # --- Code quality ---
    avoid_unnecessary_containers: true
    prefer_is_empty: true
    prefer_is_not_empty: true
    unnecessary_brace_in_string_interps: true
    unnecessary_string_interpolations: true
    unnecessary_this: true
    sort_child_properties_last: true
